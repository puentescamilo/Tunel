[package]
name = "tunel-app"
description = "Túnel: cliente SSH multiplataforma"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tunel"
path = "src/main.rs"

[dependencies]
tunel-core.workspace = true
tunel-ssh.workspace = true
tunel-term.workspace = true
tunel-sync.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
zeroize.workspace = true
serde_json.workspace = true

[dev-dependencies]
uuid.workspace = true

# Incrusta el icono y los datos de versión en el .exe de Windows.
[build-dependencies]
winresource.workspace = true

# Empaquetado con cargo-packager (ver scripts/package-macos.sh y el README).
[package.metadata.packager]
product-name = "Túnel"
identifier = "dev.tunel.tunel"
description = "Cliente SSH multiplataforma"
long-description = "Guarda hosts, claves y contraseñas en una bóveda cifrada y conecta por SSH, Mosh, Telnet o puerto serie, con túneles, SFTP y snippets."
homepage = "https://github.com/puentescamilo/Tunel"
authors = ["Camilo Puentes"]
publisher = "Camilo Puentes"
category = "DeveloperTool"
binaries = [{ path = "tunel", main = true }]
icons = ["assets/icons/icon.icns", "assets/icons/icon.ico", "assets/icons/256x256.png", "assets/icons/128x128.png", "assets/icons/32x32.png"]
out-dir = "../../dist"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
signing-identity = "-"

# El binario solo enlaza libudev; X11, Wayland, OpenGL y Vulkan se cargan al arrancar.
[package.metadata.packager.deb]
package-name = "tunel"
section = "net"
depends = ["libudev1", "libxkbcommon0", "libegl1", "libgl1"]

# Instaladores de Windows: .msi (WiX) y .exe (NSIS, se instala para el usuario sin pedir administrador).
[package.metadata.packager.wix]
languages = ["es-ES"]

[package.metadata.packager.nsis]
languages = ["Spanish"]
installer-icon = "assets/icons/icon.ico"
