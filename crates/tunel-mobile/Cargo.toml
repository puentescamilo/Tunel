[package]
name = "tunel-mobile"
description = "Núcleo de Túnel para las apps de iOS, iPadOS y Android (UniFFI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `staticlib` para el XCFramework de iOS, `cdylib` para Android y para generar los enlaces.
crate-type = ["lib", "staticlib", "cdylib"]
name = "tunel_mobile"

[[bin]]
# Genera los enlaces de Swift y Kotlin: `cargo run -p tunel-mobile --bin uniffi-bindgen`.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
# Un servidor de Túnel en memoria con una cuenta de prueba, para las pruebas de las apps.
name = "servidor-de-pruebas"
path = "src/bin/servidor-de-pruebas.rs"
required-features = ["servidor-de-pruebas"]

[features]
bindgen = ["uniffi/cli"]
servidor-de-pruebas = ["dep:tunel-server", "dep:axum"]

[dependencies]
tunel-core.workspace = true
tunel-sync.workspace = true
tunel-ssh.workspace = true
uuid.workspace = true
# La fecha local, para pedir la contraseña maestra la primera vez de cada día.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio.workspace = true
zeroize.workspace = true
thiserror.workspace = true
uniffi = "0.32"
tunel-server = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Un servidor real en memoria para las pruebas de la cuenta.
tunel-server.workspace = true
axum.workspace = true
# Un servidor SSH en memoria para las pruebas de la terminal.
russh.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# En Android, los certificados de HTTPS los comprueba el sistema a través de la JVM: la app
# entrega su contexto al arrancar (ver `android.rs`). Las versiones son las que ya usa reqwest.
jni = "0.22"
rustls-platform-verifier = "0.7"
