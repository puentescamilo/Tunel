[package]
name = "tunel-vaultwarden"
description = "Cliente de Vaultwarden y Bitwarden para Túnel: inicio de sesión, sincronización y cifrado de elementos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { workspace = true, features = ["form"] }
tokio = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
zeroize.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
argon2.workspace = true
# El cifrado de Bitwarden: AES-256-CBC con HMAC-SHA256, PBKDF2 y RSA-OAEP. Son las mismas
# versiones que ya trae russh.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rsa = "0.10.0-rc.18"
sha1 = "0.11"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid.workspace = true
