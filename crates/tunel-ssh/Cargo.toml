[package]
name = "tunel-ssh"
description = "Cliente SSH de Túnel: sesiones, autenticación, jump hosts, túneles y SFTP"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tunel-core.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
rand.workspace = true
# ssh-key genera claves con rand_core 0.10.
rand10 = { package = "rand", version = "0.10" }

# Llaves FIDO2 por USB. En Windows el acceso directo por HID está bloqueado, así que allí se
# usa la API WebAuthn del sistema (ver src/webauthn.rs).
# En iOS y Android no hay acceso a USB HID: allí no se ofrecen llaves por USB.
[target.'cfg(not(any(windows, target_os = "ios", target_os = "android")))'.dependencies]
ctap-hid-fido2 = { version = "3.6.0", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
tempfile.workspace = true
