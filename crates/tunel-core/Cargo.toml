[package]
name = "tunel-core"
description = "Modelos de dominio y bóveda cifrada de Túnel"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Permite derivar claves de cuenta con parámetros baratos en las pruebas de otros crates.
test-kdf = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
zeroize.workspace = true
base64.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
tokio = { workspace = true, features = ["sync"] }
tempfile.workspace = true
# Comprime las grabaciones de sesiones; ya lo trae russh.
flate2 = "1"
# Solo la fecha del día, para pedir la contraseña maestra cada día antes de usar la huella.
chrono = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
# Permisos del archivo de la bóveda: solo el usuario actual.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

